name: Build Trantramy Rust

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecar: macos
          - os: macos-15-intel
            target: x86_64-apple-darwin
            sidecar: macos
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar: linux
    runs-on: ${{ matrix.os }}
    name: Rust — ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $versionLine = Select-String -Path src-native/Cargo.toml -Pattern '^version = "([^"]+)"$'
          $version = $versionLine.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match native Cargo version' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-native -> target'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev pkg-config
      - name: Download and verify bundled yt-dlp
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIDECAR_PLATFORM: ${{ matrix.sidecar }}
        run: |
          $manifest = Get-Content src-native/sidecars.json -Raw | ConvertFrom-Json
          $asset = $manifest.assets.($env:SIDECAR_PLATFORM)
          New-Item -ItemType Directory -Force src-native/binaries | Out-Null
          gh release download $manifest.release --repo $manifest.repository --pattern $asset.name --dir src-native/binaries
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp download failed' }
          $download = Join-Path src-native/binaries $asset.name
          $actual = (Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $asset.sha256) { throw 'yt-dlp checksum mismatch' }
          $name = if ($IsWindows) { 'yt-dlp.exe' } else { 'yt-dlp' }
          if ($asset.name -ne $name) { Move-Item $download (Join-Path src-native/binaries $name) }
          if (-not $IsWindows) { chmod +x (Join-Path src-native/binaries $name) }
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-native/Cargo.toml --check
      - name: Check Rust warnings
        run: cargo clippy --manifest-path src-native/Cargo.toml --all-targets --locked -- -D warnings
      - name: Rust regression tests
        run: cargo test --manifest-path src-native/Cargo.toml --all-targets --locked
      - name: Build native executable
        run: cargo build --manifest-path src-native/Cargo.toml --release --locked --target ${{ matrix.target }}
      - name: Verify executable and sidecar
        shell: pwsh
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          $exe = if ($IsWindows) { 'trantramy.exe' } else { 'trantramy' }
          & "src-native/target/$env:NATIVE_TARGET/release/$exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Native executable failed' }
          $sidecar = if ($IsWindows) { 'yt-dlp.exe' } else { 'yt-dlp' }
          & "src-native/binaries/$sidecar" --version
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp failed' }
      - name: Package native application
        run: cargo run --manifest-path src-native/Cargo.toml --locked --example package -- ${{ matrix.target }} src-native/target/${{ matrix.target }}/release dist
      - name: Verify extracted Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./src-native/verify-windows-package.ps1 -SkipGui
      - uses: actions/upload-artifact@v4
        with:
          name: Trantramy-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify archive checksums
        run: sha256sum --check *.sha256
        working-directory: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          name: Trantramy ${{ github.ref_name }} — Rust native
          body_path: src-native/RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.tar.gz
            artifacts/*.sha256
