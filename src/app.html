          transform: translate(-50%, -50%) scale(1);
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <div class="water-ripple-layer" id="water-ripple-layer" aria-hidden="true"></div>

    <script>
      (function() {
        // Interactive water ripple on mouse click when data-ripple="on", data-droplet="on", or data-apple-glass="on"
        window.addEventListener("pointerdown", function(e) {
          if (
            window.location.pathname.includes("/island") ||
            document.documentElement.classList.contains("island-transparent-mode") ||
            document.body.classList.contains("island-transparent-mode")
          ) {
            return;
          }
          var d = document.documentElement.dataset;
          if (d.ripple !== "on") return;
          var container = document.getElementById("water-ripple-layer");
          if (!container) return;
          var ripple = document.createElement("div");
          ripple.className = "water-drop-ripple";
          if (d.appleGlass === "on" && d.droplet !== "on") {
            ripple.style.borderColor = "rgba(255, 255, 255, 0.6)";
            ripple.style.boxShadow = "inset 0 0 12px rgba(255, 255, 255, 0.4), 0 0 16px rgba(255, 255, 255, 0.25)";
          }
          ripple.style.left = e.clientX + "px";
          ripple.style.top = e.clientY + "px";
          container.appendChild(ripple);
          setTimeout(function() {
            if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
          }, 600);
        });
      })();
    </script>
  </body>
</html>
